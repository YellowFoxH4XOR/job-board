name: Checks

on:
  push:
    paths: ["job_board/**", "tests/**", "config/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]
  pull_request:
    paths: ["job_board/**", "tests/**", "config/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
