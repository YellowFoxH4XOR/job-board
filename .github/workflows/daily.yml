name: Daily job collection

on:
  schedule:
    - cron: "30 14 * * *" # 20:00 Asia/Kolkata, every day. GitHub may queue scheduled starts.
  workflow_dispatch:
    inputs:
      mode:
        description: "Full collection publishes to Git; smoke creates a preview artifact only"
        type: choice
        options: [full, smoke]
        default: full
      new_employers:
        description: "Unresolved directory career pages to check for ATS discovery"
        type: string
        default: "80"

permissions:
  contents: read

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Discover employers and create collection shards
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'full' }}
          NEW_EMPLOYERS: ${{ inputs.new_employers || '80' }}
        run: uv run --no-dev job-board discover --mode "$MODE" --new-limit "$NEW_EMPLOYERS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection-plan
          path: |
            run/plan.json
            run/registry.json
            run/matrix.json
          retention-days: 7

  collect:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Collect / ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: ${{ matrix.portals && 'portals' || 'core' }}
      - name: Install core dependencies
        if: ${{ !matrix.portals }}
        run: uv sync --frozen --no-dev
      - name: Install portal adapter dependencies
        if: ${{ matrix.portals }}
        run: uv sync --frozen --no-dev --extra portals
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collection-plan
          path: run
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: job-cache-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: job-cache-${{ matrix.shard }}-
      - name: Collect source records
        env:
          SHARD: ${{ matrix.shard }}
          UV_NO_SYNC: "1" # Keep the optional portal dependencies installed above.
        run: uv run --no-dev job-board collect --shard "$SHARD"
      - name: Upload source checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jobs-${{ matrix.shard }}
          path: run/results
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [discover, collect]
    if: ${{ always() && needs.discover.result == 'success' && needs.collect.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collection-plan
          path: run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: jobs-*
          path: run/results
          merge-multiple: true
      - name: Validate, deduplicate, and write snapshots
        env:
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = "smoke" ]; then
            uv run --no-dev job-board publish --root run/preview
          else
            uv run --no-dev job-board publish
          fi
      - name: Commit full snapshot
        if: ${{ (inputs.mode || 'full') == 'full' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day.json data reports state registry
          if ! git diff --cached --quiet; then
            git commit -m "data: daily India and remote job snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload diagnostics and preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection-report
          path: |
            reports
            run/preview
          if-no-files-found: warn
          retention-days: 14
